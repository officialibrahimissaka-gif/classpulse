name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/local-env.ts
      - run: docker compose --env-file .local/docker.env up -d --wait
      - run: npm run db:migrate && npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y poppler-utils
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quality-evidence
          path: |
            playwright-report/
            test-results/
      - if: always()
        run: docker compose --env-file .local/docker.env down
