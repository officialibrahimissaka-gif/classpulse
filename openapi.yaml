    RunReportRequest:
      type: object
      additionalProperties: false
      required:
        - metricKeys
        - filters
        - timeZone
      properties:
        metricKeys:
          type: array
          minItems: 1
          maxItems: 22
          items:
            type: string
            pattern: ^kpi\.[0-9]{3}$
        filters:
          $ref: "#/components/schemas/FilterAst"
        timeZone:
          type: string
          maxLength: 80
    ReportProjection:
      type: object
      additionalProperties: false
      properties:
        metricKey:
          type: string
          pattern: ^kpi\.[0-9]{3}$
        value:
          type: string
          nullable: true
        unit:
          type: string
          enum:
            - count
            - percent
            - days
            - currency
            - unknown
            - suppressed
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        placementId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - accepted
            - coordinating
            - ready
            - started
            - canceled
        originalPlannedStart:
          type: string
          format: date
        actualStart:
          type: string
          format: date
          nullable: true
        label:
          type: string
          maxLength: 240
    ExportRequest:
      type: object
      additionalProperties: false
      required:
        - snapshotId
        - format
      properties:
        snapshotId:
          type: string
          format: uuid
        format:
          type: string
          enum:
            - pdf
            - csv
            - xlsx
    WebhookEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - type
        - schemaVersion
        - occurredAt
        - aggregateId
        - aggregateVersion
        - data
      properties:
        eventId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - placement.created
            - placement.replanned
            - placement.readiness_decided
            - placement.started
            - task.completed
            - module.state_changed
            - export.ready
            - payroll.run_finalized
            - expense.reimbursed
            - support.ticket_resolved
        schemaVersion:
          type: integer
          enum:
            - 1
        occurredAt:
          type: string
          format: date-time
        aggregateId:
          type: string
          format: uuid
        aggregateVersion:
          type: integer
          minimum: 1
        data:
          type: object
          additionalProperties: false
          required:
            - resourceId
          properties:
            resourceId:
              type: string
              format: uuid
            state:
              type: string
              maxLength: 30
    WebhookAck:
      type: object
      additionalProperties: false
      required:
        - accepted
      properties:
        accepted:
          type: boolean
          enum:
            - true
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 160
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exact strong ETag returned for the current resource; stale → 412, missing → 428.
      schema:
        type: string
        pattern: ^"v[1-9][0-9]*"$
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
      description: Signed cursor binding tenant, actor scope/filter/order hash, last createdAt/id, as-of ceiling and
        expiry. Not an offset or authorization grant.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
