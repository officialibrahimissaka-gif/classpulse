components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-cp-session
      description: Local HTTP uses cp-local-session; never a bearer token.
    identity:
      type: apiKey
      in: cookie
      name: cp-identity
  schemas:
    Setup:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 240
        slug:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,59}$
        country:
          type: string
          pattern: ^[A-Z]{2}$
        authority:
          type: string
          minLength: 2
          maxLength: 80
        timeZone:
          type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        retentionDays:
          type: integer
          minimum: 30
          maximum: 3650
        retentionReference:
          type: string
          minLength: 10
          maxLength: 500
        acknowledged:
          type: boolean
          const: true
      required:
        - name
        - slug
        - country
        - authority
        - timeZone
        - currency
        - retentionDays
        - retentionReference
        - acknowledged
      additionalProperties: false
    ClientInput:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 60
        name:
          type: string
          minLength: 1
          maxLength: 200
        entityId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      required:
        - code
        - name
      additionalProperties: false
    PlacementInput:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        candidateName:
          type: string
          minLength: 1
          maxLength: 200
        candidateKey:
          type: string
          minLength: 1
          maxLength: 160
        sourceProfile:
          type: string
          minLength: 1
          maxLength: 80
        sourceKey:
          type: string
          minLength: 1
          maxLength: 160
        acceptedOn:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        plannedStart:
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
      required:
        - clientId
        - candidateName
        - candidateKey
        - sourceProfile
        - sourceKey
        - acceptedOn
        - plannedStart
      additionalProperties: false
    PlacementAction:
      oneOf:
        - type: object
          properties:
            action:
              type: string
              const: complete
            taskId:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            evidence:
              type: string
              minLength: 3
              maxLength: 500
          required:
            - action
            - taskId
            - evidence
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: waive
            taskId:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            reason:
              type: string
              minLength: 3
              maxLength: 300
          required:
            - action
            - taskId
            - reason
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: ready
            reason:
              type: string
              minLength: 1
              maxLength: 200
          required:
            - action
            - reason
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: start
            date:
              type: string
              format: date
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            reason:
              type: string
              minLength: 1
              maxLength: 200
          required:
            - action
            - date
            - reason
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: cancel
            reason:
              type: string
              minLength: 1
              maxLength: 200
          required:
            - action
            - reason
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: reopen
            reason:
              type: string
              minLength: 1
              maxLength: 200
          required:
            - action
            - reason
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: reschedule
            date:
              type: string
              format: date
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            reason:
              type: string
              minLength: 1
              maxLength: 200
          required:
            - action
            - date
            - reason
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: exception
            category:
              type: string
              enum:
                - candidate
                - client
                - documentation
                - scheduling
                - other
          required:
            - action
            - category
          additionalProperties: false
        - type: object
          properties:
            action:
              type: string
              const: resolve
            exceptionId:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            reason:
