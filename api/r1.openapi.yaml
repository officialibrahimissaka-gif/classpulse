openapi: 3.1.0
info:
  title: ClassPulse internal R1 API
  version: 0.1.0
  description: "Implemented application contract, not a public integration API. UTC timestamps, calendar-date
    filters inclusive; fixed local bounds: clients/members/views 100 and source report 10,000. Auth routes use
    OIDC PKCE/state/nonce and sealed identity/invitation cookies; see docs/API_CONTRACT.md."
servers:
  - url: http://127.0.0.1:3000
    description: Local development. Production uses the configured HTTPS origin.
paths:
  /api/v1/me:
    get:
      operationId: R1-API-001
      summary: GET /api/v1/me
      description: "Internal R1 endpoint. Permission: session. Module: platform.core. Current
        tenant/session/role/module/scope checks apply on every request. Lists are bounded; no public
        integration API is offered. Exports are limited to 5,000 rows."
      security:
        - session: []
      parameters: []
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400": &a1
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": &a2
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403": &a3
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404": &a4
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409": &a5
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412": &a6
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413": &a7
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422": &a8
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428": &a9
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429": &a10
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500": &a11
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503": &a12
          description: Problem response; field paths/codes only, never request values.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/clients:
    get:
      operationId: R1-API-002
      summary: GET /api/v1/clients
      description: "Internal R1 endpoint. Permission: accounts.read. Module: crm.accounts. Current
        tenant/session/role/module/scope checks apply on every request. Lists are bounded; no public
        integration API is offered. Exports are limited to 5,000 rows."
      security:
        - session: []
      parameters:
        - in: query
          name: after
          required: false
          schema: &a13
            type: string
            format: uuid
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Authorized operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
